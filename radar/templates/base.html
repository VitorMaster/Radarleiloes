<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Radar de Leilões{% endblock %}</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e3df;--accent:#1f5fbf;
--A:#1e8a4c;--B:#6aa832;--C:#d08a12;--D:#c0392b;--na:#8a8a85}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe7;--muted:#a3a29c;--line:#33332f;--accent:#6fa0ef}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:20px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font-size:17px}header a{color:var(--muted);text-decoration:none}header a:hover{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
a{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.g-A{background:var(--A)}.g-B{background:var(--B)}.g-C{background:var(--C)}.g-D{background:var(--D)}.g-sem_info,.g-none{background:var(--na)}
.r-baixo{background:var(--A)}.r-medio{background:var(--C)}.r-alto{background:var(--D)}.r-sem_info,.r-none{background:var(--na)}
form.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
form.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
button{background:var(--accent);color:#fff;border:0;cursor:pointer}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{flex:1;min-width:140px}.kpi b{font-size:22px;display:block}
.table-wrap{overflow-x:auto}footer{max-width:1180px;margin:0 auto;padding:20px 16px;color:var(--muted);font-size:12px}
blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--muted)}
</style>
</head>
<body>
<header><b>📡 Radar de Leilões</b><a href="/">Lotes</a><a href="/perfis">Alertas</a><a href="/fontes">Fontes</a></header>
<main>{% block content %}{% endblock %}</main>
<footer>{{ disclaimer }}</footer>
</body></html>
